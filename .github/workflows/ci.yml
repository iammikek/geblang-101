name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: dwgebler/geblang:1.32.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check
        run: geblang check src/

      - name: Test
        run: geblang test tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: geblang-101:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
